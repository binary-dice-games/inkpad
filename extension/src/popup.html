<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>inkpad</title>
    <style>
      :root {
        color-scheme: light dark;
        --border: #d9d9e0;
        --accent: #0f9f86;
        --muted: #60646c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --border: #363a3f;
          --muted: #b0b4ba;
        }
      }
      body {
        margin: 0;
        width: 320px;
        padding: 12px;
        font:
          13px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      p {
        margin: 6px 0;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 8px 0;
      }
      input[type='text'] {
        flex: 1;
        min-width: 0;
        padding: 5px 6px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
        background: transparent;
        color: inherit;
      }
      button {
        padding: 5px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      button.danger {
        background: #e5484d;
        border-color: #e5484d;
        color: #fff;
      }
      button:focus-visible,
      input:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      label {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 4px 0;
      }
      .warn {
        color: #b45309;
      }
      ul {
        margin: 6px 0;
        padding: 0;
        list-style: none;
      }
      li {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 2px 0;
      }
      .swatch {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
      }
      footer {
        margin-top: 10px;
        display: flex;
        justify-content: space-between;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>inkpad</h1>
    <section id="idle" hidden>
      <p>Draw on this tab and share it with anyone who has the link.</p>
      <p class="muted">
        Everything in this tab will be visible to anyone with the link. Viewers need no extension.
        Your connection address is visible to viewers.
      </p>
      <p id="restricted" class="warn" hidden></p>
      <p id="error" class="warn" role="alert" hidden></p>
      <div class="row">
        <button id="start" class="primary" type="button">Share this tab</button>
      </div>
    </section>
    <section id="live" hidden>
      <p id="state"></p>
      <div class="row">
        <input id="link" type="text" readonly aria-label="Link for viewers" />
        <button id="copy" type="button">Copy</button>
      </div>
      <p id="problem" class="warn" hidden></p>
      <p id="reattach" class="warn" hidden>
        The drawing layer is missing from the page.
        <button id="reattachButton" type="button">Show it again</button>
      </p>
      <ul id="viewers" aria-label="Viewers"></ul>
      <label><input id="drawing" type="checkbox" /> Viewers can draw</label>
      <label><input id="lock" type="checkbox" /> Lock: no new viewers</label>
      <div class="row">
        <button id="pause" type="button">Pause</button>
        <button id="newLink" type="button" title="Old links stop working; people here stay">
          New link
        </button>
        <button id="stop" class="danger" type="button">Stop</button>
      </div>
    </section>
    <footer>
      <a id="settings" href="#">Settings</a>
      <span class="muted" id="version"></span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
